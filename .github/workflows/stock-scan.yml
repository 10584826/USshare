name: Stock Scan

on:
  schedule:
    # cron 使用 UTC，每 30 分鐘執行一次。
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate dashboard snapshot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCHLIST_SYMBOLS: ${{ secrets.WATCHLIST_SYMBOLS }}
          DRY_RUN: "false"
        run: |
          python -m backend.app.cron_scan

      - name: Copy snapshot to frontend
        run: |
          mkdir -p frontend/public
          cp data/dashboard.json frontend/public/dashboard.json

      - name: Commit generated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/dashboard.json frontend/public/dashboard.json data/alert-state.json

          if git diff --cached --quiet; then
            echo "No dashboard changes."
          else
            git commit -m "chore: update dashboard snapshot"
            git push
          fi
